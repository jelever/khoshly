<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GitHub Pages serves this page for any missing path, at any depth, so
     asset links resolve from the site root. Change to "/" on a custom domain. -->
<base href="/khoshly/">
<title>الصفحة غير موجودة — خوشلي</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#D6EBEE">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<style>
  @font-face{font-family:"Thmanyah Serif Display";font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/thmanyah-serif-display-700.woff2) format("woff2")}
  :root{--violet:#4113AE;--coral:#E56157;--cream:#FCECD4;--sky:#D6EBEE;color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    padding:24px 16px;text-align:center;color:var(--violet);
    font-family:"Thmanyah Serif Display","Noto Naskh Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 30%,#e6ece4 65%,var(--cream) 100%)}
  img{width:min(150px,40vw);height:auto}
  h1{margin:0;font-size:20px;font-weight:700}
  a{display:inline-block;padding:13px 22px;border-radius:18px;background:var(--violet);color:var(--cream);
    font-size:16px;font-weight:700;text-decoration:none;box-shadow:0 12px 22px -12px rgba(65,19,174,.8)}
  a:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
</style>
</head>
<body>
  <img src="assets/img/khoshly-wordmark.webp" alt="خوشلي" width="240" height="205">
  <h1>الصفحة غير موجودة</h1>
  <a href="./">العودة إلى حسابات خوشلي</a>
</body>
</html>
