  /* Layout: the خوشلي wordmark opens the page · big platform tiles · sponsors marquee · motif pattern behind the foot */
  /* Khouchly V3 palette only: violet 4113AE · coral E56157 · cream FCECD4 · beige D6BA9A — one deliberate look in light and dark */
  :root{
    --violet:#4113AE;
    --coral:#E56157;
    --cream:#FCECD4;
    --beige:#D6BA9A;
    --sky:#D6EBEE;
    --ui:"Thmanyah Serif Display","Noto Naskh Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;
    /* One scale unit for the whole page, so it keeps the same proportions on every screen.
       The design is drawn for a 390px-wide phone, where --u is exactly 1px. It follows the
       screen's width (a 430px Pro Max gets 1.1px, a 320px SE 0.82px), but never grows past
       what the screen's height allows (100vh/700: landscape phones stay at 1px) nor past 1.4px
       (tablets and desktops get a larger column, not a giant one). Text keeps a floor in px. */
    --u:min(100vw / 390, max(1px, 100vh / 700), 1.4px);
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{background:var(--cream);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--cream);color:var(--violet);font-family:var(--ui);font-size:14px;-webkit-tap-highlight-color:transparent}
  img{max-width:100%}
  .page{position:relative;overflow:hidden;min-height:100vh;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky) 22%,#e6ece4 58%,var(--cream) 82%)}
  .wrap{position:relative;z-index:1;max-width:calc(var(--u) * 460);margin:0 auto;
    padding-left:max(calc(var(--u) * 16),env(safe-area-inset-left,0px));
    padding-right:max(calc(var(--u) * 16),env(safe-area-inset-right,0px))}

  /* hero */
  .hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:calc(var(--u) * 26) calc(var(--u) * 4)}
  .hero h1{margin:0;line-height:0}
  .hero .mark{width:calc(var(--u) * 190);height:auto;display:block;animation:settle 1s cubic-bezier(.2,.7,.2,1) both}
  @keyframes settle{from{transform:scale(.94);opacity:.3}to{transform:none;opacity:1}}

  /* links: scattered sticker board — each platform its own size and tilt */
  .links{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:calc(var(--u) * 34);gap:calc(var(--u) * 10);padding-block:calc(var(--u) * 16) calc(var(--u) * 22)}
  .tile{--bg:#fff;--fg:#111;--go-bg:#111;--go-fg:#fff;--r:0deg;
    position:relative;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:calc(var(--u) * 8);min-width:0;overflow:hidden;
    padding:calc(var(--u) * 10) calc(var(--u) * 10) calc(var(--u) * 10) calc(var(--u) * 14);border-radius:calc(var(--u) * 24);background:var(--bg);color:var(--fg);text-decoration:none;
    box-shadow:0 14px 26px -14px rgba(65,19,174,.55);transform:rotate(var(--r));
    transition:transform .2s cubic-bezier(.2,.7,.2,1);touch-action:manipulation;
    animation:drop .7s cubic-bezier(.2,.8,.2,1.1) both;animation-delay:var(--d,0s)}
  .tile svg{width:calc(var(--u) * 34);height:calc(var(--u) * 34);display:block;flex:none}
  .tile > span:not(.go){min-width:0;flex:1}
  .tile b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:max(14px,calc(var(--u) * 15));font-weight:700;line-height:1.2}
  .tile small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:max(11px,calc(var(--u) * 11));font-weight:500;margin-top:calc(var(--u) * 2);direction:ltr;text-align:right;opacity:.8}
  .tile .go{position:absolute;top:calc(var(--u) * 7);left:calc(var(--u) * 7);width:calc(var(--u) * 18);height:calc(var(--u) * 18);font-size:calc(var(--u) * 10);border-radius:50%;
    display:grid;place-items:center;background:var(--go-bg);color:var(--go-fg);font-family:system-ui,sans-serif}
  /* hover only where there is a real pointer: on phones :hover sticks after a tap */
  @media (hover:hover){.tile:hover{transform:rotate(0deg) scale(1.03)}}
  .tile:active{transform:rotate(0deg) scale(.96)}
  .tile:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
  @keyframes drop{from{transform:translateY(-14px) rotate(calc(var(--r) * 3));opacity:.35}to{transform:rotate(var(--r));opacity:1}}
  /* placement (RTL: column 1 is the right edge) */
  .tile.p-ig  {grid-column:1 / span 3;grid-row:span 2;--r:-2deg;--d:.05s}
  .tile.p-tt  {grid-column:4 / span 3;grid-row:span 2;--r:2deg;--d:.12s;margin-top:calc(var(--u) * 10);margin-bottom:calc(var(--u) * -10)}
  .tile.p-snap{grid-column:1 / span 3;grid-row:span 2;--r:2.5deg;--d:.26s}
  .tile.p-yt  {grid-column:4 / span 3;grid-row:span 2;--r:-3deg;--d:.33s;margin-top:calc(var(--u) * 14);margin-bottom:calc(var(--u) * -14)}
  .tile.p-wa  {grid-column:1 / span 6;grid-row:span 2;--r:-1.5deg;--d:.19s;margin-top:calc(var(--u) * 14);margin-bottom:calc(var(--u) * 4)}

  .page::after{content:"";position:absolute;z-index:0;left:0;right:0;bottom:0;height:min(440px,55%);pointer-events:none;
    background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22 viewBox=%220 0 140 140%22%3E%3Cg fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E %3Cpath d=%22M18 30 l8 -8 l8 8 l-8 8 z%22 fill=%22%234113AE%22/%3E %3Cpath d=%22M96 14 l5 -5 l5 5 l-5 5 z%22 fill=%22%23E56157%22/%3E %3Cpath d=%22M104 14 l5 -5 l5 5 l-5 5 z%22 fill=%22%23E56157%22/%3E %3Cpath d=%22M52 74 q14 -18 28 0 t28 0%22 stroke=%22%234113AE%22 stroke-width=%223.2%22/%3E %3Cpath d=%22M10 104 q8 -9 16 0%22 stroke=%22%23E56157%22 stroke-width=%223%22/%3E %3Ccircle cx=%22118%22 cy=%2264%22 r=%223%22 fill=%22%23D6BA9A%22/%3E %3Ccircle cx=%2238%22 cy=%2266%22 r=%222.4%22 fill=%22%234113AE%22/%3E %3Cpath d=%22M70 112 l7 -7 l7 7 l-7 7 z%22 stroke=%22%23D6BA9A%22 stroke-width=%222.6%22/%3E %3Cpath d=%22M118 118 c-6 -8 6 -12 0 -20%22 stroke=%22%234113AE%22 stroke-width=%222.6%22/%3E %3Ccircle cx=%2264%22 cy=%2226%22 r=%222.4%22 fill=%22%23D6BA9A%22/%3E %3Cpath d=%22M30 132 l4 -4 l4 4 l-4 4 z%22 fill=%22%234113AE%22/%3E %3C/g%3E%3C/svg%3E") repeat center bottom / 140px 140px;opacity:.3;
    -webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}

  /* sponsors marquee */
  .sponsors{--gap:calc(var(--u) * 12);position:relative;z-index:1;margin-top:calc(var(--u) * 18);padding-block:calc(var(--u) * 16) calc(var(--u) * 18);background:var(--violet);overflow:hidden}
  .sp-title{margin:0 0 calc(var(--u) * 12);text-align:center;font-size:max(14px,calc(var(--u) * 14));font-weight:700;color:var(--cream);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  /* Two identical lists side by side, each at least as wide as the screen and each sliding
     by exactly its own width plus the gap: the second takes the first's place, so the loop
     has no seam and no empty stretch at any width. On screens wider than one set of logos,
     the logos spread out to fill it. */
  .sp-rail{display:flex;gap:var(--gap);overflow:hidden;direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .sp-track{flex:none;display:flex;justify-content:space-around;gap:var(--gap);min-width:100%;margin:0;padding:0;list-style:none;animation:spRun 60s linear infinite}
  @media (hover:hover){.sponsors:hover .sp-track{animation-play-state:paused}}
  @keyframes spRun{from{transform:translateX(0)}to{transform:translateX(calc(-100% - var(--gap)))}}
  .sp{flex:none;display:grid;place-items:center;height:calc(var(--u) * 44);padding:0 calc(var(--u) * 12);border-radius:calc(var(--u) * 12);background:#fff}
  .sp img{display:block;height:calc(var(--u) * 28);width:auto;max-width:calc(var(--u) * 96);object-fit:contain}

  /* name */

  .me{margin:0}
  .me figcaption{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u) * 14);text-align:center;padding-block:calc(var(--u) * 4) calc(var(--u) * 8)}
  .me h2{margin:0;line-height:0}
  .me .who{width:calc(var(--u) * 230);height:auto}

  @media (prefers-reduced-motion:reduce){.sp-track{animation:none}.sp-rail{overflow-x:auto}.hero .mark,.tile{animation:none}.tile{transition:none}}
</style>
